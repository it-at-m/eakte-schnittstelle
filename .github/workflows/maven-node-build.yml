name: Build all

on:
  pull_request:
  push:
    branches:
       - '*'
     # - "main"
     # - "proxy-with-github-image"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TZ: Europe/Berlin # timezone
    strategy:
      fail-fast: false
      matrix:
        include: # hier müssen die Pfade angegeben werden
          - app-path: v1/eakte-eai
            image-path: v1/eakte-eai
          - app-path: v1/eakte-api-v1
          - app-path: v2
            image-path: v2/eakte-api-v2-gateway

    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        
#      - if: ${{ hashFiles(format('./{0}/package.json', matrix.app-path))!=null }}
#        id: node
#        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@7cb754b2056cebda6c36db344434f85be398c493 # v1.0.25
#        with:
#          app-path: ${{ matrix.app-path }}
#          node-version: "24"
      - name: Check for build
        run: |
          echo "Check if there will be a build: "
          echo "Pom.xml da ${{'./{0}/pom.xml' }}"
          echo "ausdruck ${{ hashFiles(format('./{0}/pom.xml', matrix.app-path))!=null }}"

      - if: ${{ hashFiles(format('./{0}/pom.xml', matrix.app-path))!=null }}
        id: maven
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        with:
          app-path: ${{ matrix.app-path }}
          java-version: "21"
      - uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        if: github.ref == 'refs/heads/main' && matrix.image-path
        with:
          path: ${{ matrix.image-path }}
          image-name: ${{ matrix.image-path }}
          artifact-name: ${{ join(steps.*.outputs.artifact-name) }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.actor }}
          image-tags: |
            type=raw,value=${{ github.ref == 'refs/heads/main' && 'dev' || github.ref_name }}
