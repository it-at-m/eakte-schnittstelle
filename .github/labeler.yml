"Type: Feature":
  - head-branch: ['^feat', '-feature-']
"Type: Bug":
  - head-branch: ['^bug', '-bug-', '^fix']
"Type: Maintenance":
  - head-branch: ['^maint', '^refact', '^chore', '-maintenance-']
"Type: Documentation":
  - head-branch: ['^docs', '-documentation-']
  - changed-files:
    - any-glob-to-any-file: ['docs/**']
"Type: Dependency":
  - head-branch: ['^dep', '-dependency-']
"Type: Security":
  - head-branch: ['^sec', '-security-']
"Component: CI/CD":
  - changed-files:
    - any-glob-to-any-file: ['.github/**']
"Component: Stack":
  - changed-files:
      - any-glob-to-any-file: ['stack/**']
"Version: V1":
  - changed-files:
    - any-glob-to-any-file: ['v1/**']
"Version: V2":
  - changed-files:
      - any-glob-to-any-file: ['v2/**']
