get:
  tags:
    - /subjectAreaFileObjects
  summary: Liste von Vorgängen einer Akte auslesen
  description: |
    Stornierte Objekte können nicht ausgelesen werden, 
    d.h. Objekte mit dem Status „Storniert“ [FSCFOLIO@1.1001:objdocstate=Storniert] 
    werden gefiltert und nicht zurückgegeben.\
    Über die optionalen Parameter kann die Liste vorgefiltert werden, 
    d.h. es werden lediglich die Objekte übermittelt, auf welche die optionalen Parameter zutreffen.
  # falsche OperationId (synonym zu SOAP-Operation): muss sein "ReadSubjectAreaFileObjects"
  operationId: ReadSubjectAreaFile
  parameters:
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/x_anwendung'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/userlogin'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/joboe'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/jobposition'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/propdocstate'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/propbostate'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/objaddress'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'eakte-api-subjectAreaFileObjects_@addr-schemas.yaml#/components/schemas/ReadSubjectAreaFileAntwortDTO'
    '400':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/400'
    '401':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/401'
    '500':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/500'
