get:
  tags:
    - /apentries
  summary: Untergeordnete Aktenplaneinträge auslesen
  description: |
    Untergeordnete Aktenplaneinträge eines Aktenplaneintrags werden durch Übergabe der COO-Adresse abgefragt. 
    Als Rückgabewerte erhält den Namen des Aktenplaneintrags und seine COO-Adresse.\
    Ist die übergebene Objektadresse kein Aktenplaneintrag, 
    so wird eine Fehlermeldung des Standardprodukts zurückgegeben.\
    Wenn bei der Rückgabe der gesamten Objektliste auf bestimmte Objekte kein Zugriff besteht, 
    werden diese Objekte mit der Information „Zugriff verweigert“ mit ausgegeben.
  operationId: ReadApentry
  parameters:
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/x_anwendung'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/userlogin'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/joboe'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/jobposition'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/objaddress'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'eakte-api-apentries_@addr-schemas.yaml#/components/schemas/ReadApentryAntwortDTO'
    '400':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/400'
    '401':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/401'
    '500':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/500'
