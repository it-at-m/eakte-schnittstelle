
post:
  tags:
    - /subjectAreaUnits
  summary: Betreffseinheit anlegen
  description: |
    Ein neuer Aktenplaneintrag [COOELAK@1.1001:SubjectArea] des Aktenplaneintragstyps „Betreffseinheit“ 
    wird unter dem angegebenen übergeordneten Aktenplaneintrag erstellt.\
    Beim Anlegen von neuen Aktenplaneinträgen wird die 
    auf dem angegebenen übergeordneten Aktenplaneintrag angegebene Zugriffsdefinition übernommen.
  operationId: CreateSubjectAreaUnit
  parameters:
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/x_anwendung'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/userlogin'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/joboe'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/jobposition'
  requestBody:
    content:
      application/json:
        schema:
          $ref: 'eakte-api-subjectAreaUnits-schemas.yaml#/components/schemas/CreateSubjectAreaUnitAnfrageDTO'
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'eakte-api--global-schemas.yaml#/components/schemas/DmsObjektResponse'
    '400':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/400'
    '401':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/401'
    '500':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/500'
