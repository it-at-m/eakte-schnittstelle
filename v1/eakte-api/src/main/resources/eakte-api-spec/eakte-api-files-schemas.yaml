components:
  schemas:
    CreateFileDTO:
      required:
        - apentry
      type: object
      properties:
        shortname:
          type: string
          description: |
            Der Name wird in der eAkte gebildet aus dem "Titel der Akte" 
            ("Aktenplankennzeichen des Aktenplankennzeichens, in dem die Akte liegt"-
            "laufende Nummer der Akte innerhalb des Aktenplaneintrags")
          example: 2016 Anträge Firma XY (1001-47)
        filesubj:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/Betreff'
        objterms:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/Schlagworte'
        accdef:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/Zugriffsdefinition'
        apentry:
          type: string
          description: Aktenplankennzeichen (Objekt-ID des APl-Kennzeichens)
          example: COO.1.2301.1.683
        fileruntimefrom:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/fileruntimefrom'
        fileruntimetill:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/fileruntimetill'
        fileouobj:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/fileouobj'
        procedureaccdef:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/procedureaccdef'
        definition:
          type: string
          description: Objekt-ID (COO-Adresse) der Definition für Verfahren
        userformsdata:
          type: array
          items:
            $ref: 'eakte-api--global-schemas.yaml#/components/schemas/UserFormsReferenz'

