put:
  tags:
    - /cancelObjects
  summary: Objekt stornieren (Vorgang, Dokument, Schriftstück)
  description: |
    Stornieren wird verwendet, wenn fälschlicherweise ein Schriftgutobjekt erstellt worden ist.\
    Nach dem Stornieren kann das stornierte Objekt über die Schnittstelle nicht mehr ausgelesen werden.\
    Das Aufheben von stornierten Objekten ist nur in der GUI der eGov-Suite möglich, nicht über die Schnittstelle.
    
    Der Status [FSCFOLIO@1.1001:objdocstate] des Objekts wird auf „Storniert“ gesetzt. 
    Zudem erfolgt gemäß dem Berechtigungskonzept ein Access Control List (ACL) Übergang.\
    Welcher ACL-Übergang beim Stornieren erfolgt, ist im Berechtigungskonzept definiert und 
    ist abhängig von der hinterlegten ACL des zu stornierenden Objekts.\
    Beispiel: Eine Akte hat die ACL für Schriftgutobjekte des Eigentümers. 
    Im Rahmen der Stornierung erfolgt der ACL-Übergang und 
    die Akte erhält die ACL für abgeschlossene Schriftgutobjekte des Eigentümers.
    
    Bei einer Stornierung werden auch alle untergeordneten Schriftgutobjekte storniert.
  operationId: CancelObject
  parameters:
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/x_anwendung'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/userlogin'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/joboe'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/jobposition'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/objaddress'
  responses:
    '204':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/204'
    '400':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/400'
    '401':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/401'
    '500':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/500'
