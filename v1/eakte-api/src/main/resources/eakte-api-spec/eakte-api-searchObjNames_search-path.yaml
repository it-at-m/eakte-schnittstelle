
post:
  tags:
    - /searchObjNames
  summary: Suche nach Objektnamen
  description: |
    Mit diesem Aufruf ist eine generische Suche möglich, mit dem ein Objekt bzw. 
    Objekte auf Basis des Objektnamens gesucht und zurückgegeben werden können.\
    Bei Bedarf kann die Suche in einer weiteren Ausbaustufe der Schnittstelle 
    erweitert werden, sodass beispielsweise die Suche auch auf das Erstellungsdatum 
    oder das letzte Änderungsdatum von Objekten eingeschränkt werden kann.
    
    Im Suchstring können folgende Operatoren verwendet werden:
    
    „*“ oder „%“ Der Stern „*“ steht für eine beliebige Zeichenfolge.
    * Optional zum Zeichen „*“ kann auch das Prozentzeichen „%“ verwendet werden.
    * Beispiele: 
    * Eine Suche nach „*berg“ liefert Ergebnisse, 
    die eine beliebige Zeichenfolge gefolgt von der Zeichenfolge „berg“ enthalten – 
    „Eisberg“, „Zauberberg“, „Erzberg“. 
    * Eine Suche nach „Berg*“ liefert Ergebnisse, 
    die „Berg“ gefolgt von einer beliebigen Zeichenfolge enthalten – 
    „Berger“, „Bergsteiger“, „Berghotel“. 
    * Eine Suche nach „Ber*er“ liefert Ergebnisse, die „Ber“ 
    gefolgt von einer beliebigen Zeichenfolge 
    sowie gefolgt von „er“ enthalten – „Berger“, „Bergsteiger“, „Berliner“.
    
    „?“ oder „_“ Das Fragezeichen „?“ steht für exakt ein Zeichen.
    * Optional zum Zeichen „?“ kann auch das Zeichen Unterstrich „_“ verwendet werden.
    * Beispiel: Eine Suche nach „_atterbauer“ liefert Ergebnisse, 
    die exakt ein (beliebiges) Zeichen gefolgt von der Zeichenkette „atter-bauer“ enthalten – 
    „Katterbauer“, „Patterbauer“, „Natterbauer“.
    
    „~“ Die Tilde „~“ (erreichbar über die Tastenkombination AltGr +) steht für eine phonetische Suche.
    * Es werden alle Objekte gefunden, bei denen die Aussprache 
    der im Suchkriterium angegebenen Zeichenkette ähnlich ist. 
    Eine Tilde muss genau am Beginn des Suchkriteriums eingegeben werden.
    * Beispiel: Eine Suche nach „~Maier“ liefert ähnlich klingende Ergebnisse wie „Maier“ und „Meier“.
    
    „[ ] „ Für mehrere Zeichen, von denen genau eines vorhanden sein muss, 
    können eckige Klammern „[ ]“ verwendet werden.
    * Die in Frage kommenden Zeichen werden ohne Leerzeichen und ohne Komma eingegeben 
    (Hinweis: Die genaue Funktionalität hängt von der verwendeten Datenbank ab). 
    Wenn ein Leerzeichen zwischen Zeichen eingegeben wird, 
    so wird auch das Leerzeichen als mögliches Zeichen gewertet.
    * Beispiel: Es werden Word-Objekte gesucht, 
    deren Name entweder „Test-Eingangsstück“, „Tast-Eingangsstück“ oder 
    „T st-Eingangsstück“ ist. Dazu wird als Suchstring eingegeben: „T[e a]st-Eingangsstück“.
    
    Hinweis:\
    Stornierte Objekte können nicht ausgelesen werden, d.h. Objekte mit dem Status „Storniert“ 
    [FSCFOLIO@1.1001:objdocstate=Storniert] werden gefiltert und nicht zurückgegeben.
  operationId: SearchObjName
  x-soap-operation: SearchObjNameGI
  parameters:
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/x_anwendung'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/userlogin'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/joboe'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/jobposition'
  requestBody:
    content:
      application/json:
        schema:
          $ref: 'eakte-api-searchObjNames_search-schemas.yaml#/components/schemas/SearchObjNameAnfrageDTO'
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'eakte-api-searchObjNames_search-schemas.yaml#/components/schemas/SearchObjNameAntwortDTO'
    '400':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/400'
    '401':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/401'
    '500':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/500'
