put:
  tags:
    - /depositObjects
  summary: z.A. setzen von Akten und Vorgängen
  description: |
    Der Status der Akte oder des Vorgangs wird „z.A.“ gesetzt.
    * Alle Vorgänge unter der betreffenden Akte werden z.A. gesetzt.
    * Für die betreffende Akte wird das Feld "gültig bis" 
    auf das Datum der Durchführung des Calls gesetzt.
    * Neue Vorgänge können nach dem Bayern Standard nicht mehr angelegt und 
    Inhalte nicht mehr bearbeitet werden.
    * Das Transfer- und Aussonderungsdatum für Vorgänge wird 
    auf Basis von Aufbewahrungsfrist und Aussonderungsart berechnet und gesetzt.
    * Eine Akte kann lediglich dann z.A. geschrieben werden, 
    wenn bei keinem der darunterliegenden Vorgänge ein offener Prozesse/Laufwege vorliegt.
  operationId: DepositObject
  parameters:
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/x_anwendung'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/userlogin'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/joboe'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/jobposition'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/objaddress'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'eakte-api--global-schemas.yaml#/components/schemas/DmsObjektResponse'
    '400':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/400'
    '401':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/401'
    '500':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/500'
