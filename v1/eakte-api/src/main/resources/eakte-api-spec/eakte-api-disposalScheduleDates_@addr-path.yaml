put:
  tags:
    - /disposalScheduleDates
  summary: Aufbewahrungsdatum setzen
  description: |
    Bei Akten und Vorgängen kann das vorgesehene Endedatum der Aufbewahrung geändert werden, nachdem sie z.A. gesetzt wurden.\
    Das angegebene Datum in der Eigenschaft „Aufbewahrung.vorgesehen“ [COOELAK@1.1001:filelifetime.COOELAK@1.1001:offltscheduled] 
    wird überschrieben und das Datum (FSCSCHEDULE@1.1001:nddate) des Fristen-Objekts vom Typ Aufbewahrung.
  operationId: DisposalScheduleDate
  parameters:
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/x_anwendung'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/userlogin'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/joboe'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/jobposition'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/objaddress'
  requestBody:
    content:
      application/json:
        schema:
          $ref: 'eakte-api-disposalScheduleDates_@addr-schemas.yaml#/components/schemas/SetDisposalScheduleDateAnfrageDTO'
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'eakte-api-disposalScheduleDates_@addr-schemas.yaml#/components/schemas/SetDisposalScheduleDateAntwortDTO'
    '400':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/400'
    '401':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/401'
    '500':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/500'
