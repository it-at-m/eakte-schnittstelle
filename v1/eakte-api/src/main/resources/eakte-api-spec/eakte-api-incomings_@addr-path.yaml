put:
  tags:
    - /incomings
  summary: Eingang ändern
  description: |
    Die Werte werden mit den übergebenen Parametern überschrieben. 
    Bei keiner Übergabe bleiben die bestehenden Werte erhalten.\
    Ausnahme: Inhaltsobjekte können über diesen Aufruf nur hinzugefügt werden.\
    Dokumente können nur in bereits bestehenden Vorgängen angelegt werden.
    Bei jeder Änderung über die Schnittstelle wird in der eGov-Suite eine neue Version des Objekts erzeugt. Dies betrifft auch wiederholte Änderungen, die durch einen Benutzer durchgeführt werden.
  operationId: UpdateIncoming
  parameters:
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/x_anwendung'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/userlogin'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/joboe'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/jobposition'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/objaddress'
  requestBody:
    content:
      multipart/form-data:
        schema:
          $ref: 'eakte-api-incomings_@addr-schemas.yaml#/components/schemas/UpdateIncomingRequestBodyDTO'
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'eakte-api-incomings_@addr-schemas.yaml#/components/schemas/UpdateIncomingAntwortDTO'
    '400':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/400'
    '401':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/401'
    '500':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/500'
