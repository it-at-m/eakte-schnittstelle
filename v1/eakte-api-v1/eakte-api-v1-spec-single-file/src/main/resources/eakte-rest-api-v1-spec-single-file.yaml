      summary: Setzen/Aktualisieren von Fachdaten
      description: |
        Diese Funktion soll bei neuen Schnittstellen nicht mehr benutzt werden.<br>
        Dafür gibt es die neue Funktion für Verfahrensdaten PUT /userFormsData
      operationId: UpdateBusinessDataValue
      parameters:
        - $ref: '#/components/parameters/x_anwendung'
        - $ref: '#/components/parameters/userlogin'
        - $ref: '#/components/parameters/joboe'
        - $ref: '#/components/parameters/jobposition'
