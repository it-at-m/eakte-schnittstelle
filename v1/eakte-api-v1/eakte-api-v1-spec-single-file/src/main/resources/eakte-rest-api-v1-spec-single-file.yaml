        - $ref: '#/components/parameters/jobposition'
        - $ref: '#/components/parameters/objaddress'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /apentries/{objaddress}:
    get:
      tags:
        - /apentries
      summary: Untergeordnete Aktenplaneinträge auslesen
      description: |
        Untergeordnete Aktenplaneinträge eines Aktenplaneintrags werden durch Übergabe der COO-Adresse abgefragt. 
        Als Rückgabewerte erhält den Namen des Aktenplaneintrags und seine COO-Adresse.<br>
        Ist die übergebene Objektadresse kein Aktenplaneintrag, 
        so wird eine Fehlermeldung des Standardprodukts zurückgegeben.<br>
        Wenn bei der Rückgabe der gesamten Objektliste auf bestimmte Objekte kein Zugriff besteht, 
        werden diese Objekte mit der Information „Zugriff verweigert“ mit ausgegeben.
      operationId: ReadApentry
      parameters:
        - $ref: '#/components/parameters/x_anwendung'
        - $ref: '#/components/parameters/userlogin'
        - $ref: '#/components/parameters/joboe'
        - $ref: '#/components/parameters/jobposition'
        - $ref: '#/components/parameters/objaddress'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadApentryAntwortDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /apentries/search:
