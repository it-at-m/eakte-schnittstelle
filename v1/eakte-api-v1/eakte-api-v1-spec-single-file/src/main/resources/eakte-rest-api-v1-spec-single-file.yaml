          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchApentryResponseDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /businessDataValue/{objaddress}:
