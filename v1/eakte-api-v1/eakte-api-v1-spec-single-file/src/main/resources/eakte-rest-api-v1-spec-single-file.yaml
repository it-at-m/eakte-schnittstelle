      summary: Schriftstück Metadaten lesen
      operationId: ReadContentObjectMetaData
      parameters:
        - $ref: '#/components/parameters/x_anwendung'
        - $ref: '#/components/parameters/userlogin'
        - $ref: '#/components/parameters/joboe'
        - $ref: '#/components/parameters/jobposition'
        - $ref: '#/components/parameters/objaddress'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadContentObjectMetaDataAntwortDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /contentObjects:
    post:
      tags:
        - /contentObjects
      summary: Schriftstück anlegen
      operationId: CreateContentObject
      parameters:
        - $ref: '#/components/parameters/x_anwendung'
        - $ref: '#/components/parameters/userlogin'
        - $ref: '#/components/parameters/joboe'
        - $ref: '#/components/parameters/jobposition'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateContentObjectRequestBodyDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContentObjectAntwortDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /contentObjects/{objaddress}:
    get:
      tags:
        - /contentObjects
      summary: Schriftstück lesen
      description: |
        Stornierte Objekte können nicht ausgelesen werden, 
        d.h. Objekte mit dem Status „Storniert“ [FSCFOLIO@1.1001:objdocstate=Storniert] 
        werden gefiltert und nicht zurückgegeben.<br>
        Vor dem Aufruf wird automatisiert überprüft, 
        ob die angefragte Datei größer als der angegebene Wert 
        in der Eigenschaft „Maximale Größe der Inhalte“ [FSCVAPP@1.1001:defaultimportlimit]\ 
        Derzeit beträgt die maximale Größe bei MUCS23 100 MB, im Produktivsystem MUCS26 vorr. 512 MB.  
        aus der Virtual Application Konfiguration ist. 
        Sofern die Datei größer ist als der angegebene Wert in MB ist, 
        wird der Inhalt das Schriftstücks nicht ausgelesen und eine Fehlermeldung zurückgegeben.
      operationId: ReadContentObject
      parameters:
        - $ref: '#/components/parameters/x_anwendung'
        - $ref: '#/components/parameters/userlogin'
        - $ref: '#/components/parameters/joboe'
        - $ref: '#/components/parameters/jobposition'
        - $ref: '#/components/parameters/objaddress'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadContentObjectResponseDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
    put:
      tags:
        - /contentObjects
      summary: Schriftstück ändern
      operationId: UpdateContentObject
      parameters:
        - $ref: '#/components/parameters/x_anwendung'
        - $ref: '#/components/parameters/userlogin'
        - $ref: '#/components/parameters/joboe'
        - $ref: '#/components/parameters/jobposition'
        - $ref: '#/components/parameters/objaddress'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateContentObjectRequestBodyDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateContentObjectAntwortDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /depositObjects/{objaddress}:
    put:
      tags:
        - /depositObjects
      summary: z.A. setzen von Akten und Vorgängen
      description: |
        Der Status der Akte oder des Vorgangs wird „z.A.“ gesetzt.
        * Alle Vorgänge unter der betreffenden Akte werden z.A. gesetzt.
        * Für die betreffende Akte wird das Feld "gültig bis" 
        auf das Datum der Durchführung des Calls gesetzt.
        * Neue Vorgänge können nach dem Bayern Standard nicht mehr angelegt und 
        Inhalte nicht mehr bearbeitet werden.
        * Das Transfer- und Aussonderungsdatum für Vorgänge wird 
        auf Basis von Aufbewahrungsfrist und Aussonderungsart berechnet und gesetzt.
        * Eine Akte kann lediglich dann z.A. geschrieben werden, 
        wenn bei keinem der darunterliegenden Vorgänge ein offener Prozess/Laufweg vorliegt.
      operationId: DepositObject
      parameters:
        - $ref: '#/components/parameters/x_anwendung'
        - $ref: '#/components/parameters/userlogin'
        - $ref: '#/components/parameters/joboe'
        - $ref: '#/components/parameters/jobposition'
        - $ref: '#/components/parameters/objaddress'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmsObjektResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /disposalScheduleDates/{objaddress}:
    put:
      tags:
        - /disposalScheduleDates
      summary: Aufbewahrungsdatum setzen
      description: |
        Bei Akten und Vorgängen kann das vorgesehene Endedatum der Aufbewahrung geändert werden, nachdem sie z.A. gesetzt wurden.<br>
        Das angegebene Datum in der Eigenschaft „Aufbewahrung.vorgesehen“ [COOELAK@1.1001:filelifetime.COOELAK@1.1001:offltscheduled] 
        wird überschrieben und das Datum (FSCSCHEDULE@1.1001:nddate) des Fristen-Objekts vom Typ Aufbewahrung.
      operationId: DisposalScheduleDate
      parameters:
        - $ref: '#/components/parameters/x_anwendung'
        - $ref: '#/components/parameters/userlogin'
        - $ref: '#/components/parameters/joboe'
        - $ref: '#/components/parameters/jobposition'
        - $ref: '#/components/parameters/objaddress'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDisposalScheduleDateAnfrageDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetDisposalScheduleDateAntwortDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /documentObjects/{objaddress}:
    get:
      tags:
        - /documentObjects
      summary: Liste von Schriftstücken auslesen
      description: |
        Stornierte Objekte können nicht ausgelesen werden, 
        d.h. Objekte mit dem Status „Storniert“ [FSCFOLIO@1.1001:objdocstate=Storniert] werden gefiltert und nicht zurückgegeben.<br>
        Über die optionalen Parameter kann das Fachverfahren vorab eine Selektierung der Liste vornehmen, 
        d.h. es sollten lediglich die Objekte übermittelt werden auf welche die optionalen Parameter zutreffen.
      operationId: ReadDocumentObject
      parameters:
        - $ref: '#/components/parameters/x_anwendung'
        - $ref: '#/components/parameters/userlogin'
        - $ref: '#/components/parameters/joboe'
        - $ref: '#/components/parameters/jobposition'
        - $ref: '#/components/parameters/propdocstate'
        - $ref: '#/components/parameters/propbostate'
        - $ref: '#/components/parameters/objaddress'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadDocumentObjectsAntwortDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /files:
    post:
      tags:
        - /files
      summary: Akte anlegen
      description: |
        Sachakten können nur in Aktenplaneinträgen des Aktenplaneintragstyps „Betreffseinheit“ angelegt werden, 
        d.h. auf der untersten Ebene eines Aktenplans.
            
        Ist der übergebene Aktenplaneintrag eine Betreffseinheit (unterstes Element im Aktenplan), 
        prüft das System, ob die Betreffseinheit noch frei ist (weniger als 10.000 Akten in der Betreffseinheit)
        * Ist die Betreffseinheit frei, wird die Akte in der Betreffseinheit abgelegt.
        * Ist die Betreffseinheit nicht frei, prüft das System, ob bereits weitere Betreffseinheiten angelegt wurden und ob diese frei sind.
        * Ist eine andere bereits angelegte Betreffseinheit frei, wird die Akte in dieser Betreffseinheit abgelegt
        * Wurde noch keine weitere Betreffseinheit angelegt oder sind alle automatisch angelegten voll, 
        wird eine neue Betreffseinheit auf der gleichen Ebene mit folgendem Namen angelegt:
        Aktenplanzeichen: <Name des darüberliegenden Aktenplaneintrags> + „.„ + <Fortlaufende Nummer>\ 
        Die Akte wird in der neu erzeugten Betreffseinheit angelegt.

        Ist der übergebene Aktenplaneintrag keine Betreffseinheit, 
        eruiert das System die Liste der Betreffseinheiten, welche eine Ebene tiefer sind.<br>
        Das System prüft, ob eine dieser Betreffseinheiten frei ist.
        * Wenn eine freie Betreffseinheit gefunden wird, wird die Akte in der freien Betreffseinheit angelegt.
        * Wenn keine freie Betreffseinheit gefunden wird, wird eine neue Betreffseinheit unterhalb des übergebenen Aktenplaneintrages mit folgendem Namen angelegt:<br>
