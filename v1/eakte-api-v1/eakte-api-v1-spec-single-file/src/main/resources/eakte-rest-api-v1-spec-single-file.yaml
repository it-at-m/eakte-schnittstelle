components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        This API uses Basic Auth flow. [More info](https://api.example.com/docs/auth)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: jwt
  parameters:
    x_anwendung:
      name: x-anwendung
      in: header
      description: |
        **Aufrufende Fachanwendung**

        Für jeden Aufruf soll ersichtlich sein, 
        welche Fachanwendung den Aufruf getätigt hat. 
        Dies soll es ermöglichen, Requests und Responses den entsprechenden Fachverfahren zuzuordnen. 
        Für diesen Zweck wird sowohl im Request, 
        als auch im Response ein Parameter „businessapp“ angegeben.

        Dieser Parameter ist optional und kann mit einem Namen befüllt werden. 
        Sofern der Aufruf einen Wert enthält, wird dieser auch im Response zurückgegeben. 
        Somit ist ein nachträgliches Filtern von Aufrufen möglich.
      required: false
      schema:
        type: string
      example: SWH
    userlogin:
      name: userlogin
      in: header
      description: |
        **Benutzer-Login** (Benutzer-Kontext für den SOAP-Aufruf)<br>
        Log-in-Name des Benutzerobjekts
      required: true
      schema:
        type: string
      example: max.mustermann
    joboe:
      name: joboe
      in: header
      description: |
        COO-Adresse der zu verwendenden **Organisationseinheit** des angemeldeten Nutzers.<br>
        <br>
        Ohne Angabe der joboe und jobposition 
        wird die eingestellte Standardrolle und OE des Nutzers in der eAkte verwendet.<br>
        Wenn eine bestimmte jobposition angegeben wird, unter der dieser Aufruf ausgeführt werden soll 
        muss auch die entsprechende joboe des Nutzers mit angegeben werden. 
        Das kann z.B. notwendig sein, wenn bestimmte Funktionen nur durch Schriftgutverwalter oder Registratur ausgeführt werden dürfen.<br>
        Über die OE wird der Mandant zugeordnet und entsprechend die Berechtigungen geprüft.<br>
        Hinweis:<br>
        Die COO-Adresse für die joboe muss im Fachverfahren in einer Konfigurationsdatei hintelegt werden, da sie nicht per Schnittstelle ausgelesen werden kann und sich ggf. ändern kann. 
        Meistens ist die joboe innerhalb eines Fachbereichs für alle Benutzer gleich, so dass sie bei Änderungen einfach zu verwalten ist.
      required: false
      schema:
        type: string
      example: COO.1.2300.1.847
    jobposition:
      name: jobposition
      in: header
      description: |
        Referenz der Stelle (**Rolle des Nutzers** in der eAkte).
        * Schriftgutverwaltung - DocumentManager
        * Sachbearbeitung - OfficialInCharge
        * Fachadministration - OpAdm
        * Registratur - Official
        * Sekretariat - Secretary
        * Leitung - Head
        * Archivar - Registrar
        * Vorlagenadministrator - TemplateAdministrator
        * Vorlagenverwaltung - TemplateManager

        Es dürfen ausschließlich die o.g. genannten Stellen der LHM verwendet werden.<br>
        Bitte verwenden Sie die englische Bezeichnung.

        Die Rolle Fachadministrator ist bei Schnittstellen nicht erlaubt!
      required: false
      schema:
        type: string
      example: DocumentManager
    objaddress:
      name: objaddress
      description: Objekt-ID (COO-Adresse) des Objekts
      in: path
      required: true
      schema:
        type: string
      example: COO.1.2300.1.847
    propdocstate:
      name: propdocstate
      in: header
      description: |
        Aktueller Bearbeitungsstatus der darunterliegenden Objekte
        * 10 = In Bearbeitung
        * 20 = Suspendiert (kann wieder aufgehoben werden)
        * 30 = Abgeschlossen
        * 40 = Storniert (endgültig storniert)
        * 50 = Archiviert
      required: false
      schema:
        type: integer
      example: '12'
    propbostate:
      name: propbostate
      in: header
      description: |
        Bearbeitungsstatus der darunterliegenden Objekte<br>
        Es muss die COO-Adresse des Bearbeitungsstatus übergeben werden. 
        Die Liste kann aus dem jeweiligen System generiert werden (Suche nach Status Komponentenobjekt im Verwaltungswerkzeug)

        Je nach Bearbeitungsschritt mit dem Objekt können folgende (beispielhafte) Status vorliegen:
        * Erstellt
        * Weggelegt
        * z.A. verfügt
        * Schlusszeichnung
        * Schlusszeichnung abgelehnt
        * Billigung
        * Billigung abgelehnt
        * Mitgezeichnet
        * Mitzeichnung abgelehnt
        * Versand erzeugt
        * Versendet
        * Zu Bewerten
        * Bewertet
        * Dem Archiv übermittelt
        * Vom Archiv zurückgegeben bzw. Übernahme vom Archiv bestätigt
        * Vernichtet
      required: false
      schema:
        type: string
      example: COO.1.2301.1.679
  schemas:
    Zugriffsdefinition:
      type: string
      description: |
        Folgende Zugriffsdefinitionen sind möglich:

        * "Eigene Organisationseinheit und Linienorganisation"
        * "Eigener Mandant"
        * "Eigene Organisationseinheit und Vorgesetzte"
        * "Eigene Organisationseinheit und Vorgesetzte (ohne Zentralregistratur)"
        * "Eigene Organisationseinheit"
        * "Persönlich und Vorgesetzte"
        * "Persönlich" (für Verschlusssachen)
        * "Aktengebunden" (nur für untergeordnete Vorgänge einer Akte)

        Die Zugriffsdefinition wird jeweils auf die darunterliegenden Objekte vererbt, 
        d.h. 
        * wenn ein Wert für den Aktenplaneintrag eingetragen wird (empfohlen), 
        dann gilt dieser automatisch für alle darunter liegenden Akten, 
        * entsprechend für alle Vorgänge einer Akte, 
        wenn die Zugriffsdefinition bei der Akte eingetragen wurde und 
        * entsprechend bei allen Dokumenten eines Vorgangs, 
        wenn die Zugriffsdefinition bei dem Vorgang eingetragen wurde.

        Wenn kein Wert übergeben wird, 
        wird die auf dem jeweils höheren Objekt hinterlegte Zugriffsdefinition initialisiert.
        Wurde auf dem Aktenplaneintrag keine Zugriffsdefinition festgelegt, 
        wird die im System eingestellte Definition verwendet - "Eigener Mandant".

        Wenn Vorgänge die Zugriffsdefinition und zusätzlich berechtigte Organisationseinheiten 
        aus der übergeordneten Akte übernehmen sollen, 
        muss "Aktengebunden" für Vorgänge bei der Akte angegeben werden (procaccdef).
        Wenn eine Akte über die SST angelegt wird und 
        am Aktenplaneintrag zusätzlich berechtigte OE's eingetragen wurden 
        (im Reiter "Sicherheitseinstellungen" des Aktenplaneintrags), 
        dann wird die Zugriffsdefinition "Aktengebunden" automatisch für Vorgänge gesetzt.
      example: Eigener Mandant
    UpdateAccessDefinitionObjectAnfrageDTO:
      required:
        - objaccdef
      type: object
      properties:
        objaccdef:
          $ref: '#/components/schemas/Zugriffsdefinition'
        authinheritance:
          type: integer
          description: |
            Rechtevererbung<br>
            Mögliche Werte: null,0,1,2

            0 oder leer (null): Die Rechtevererbung aus dem Standardprodukt wird
            verwendet.<br>
            Der neue Wert wird rekursiv gesetzt in Abhängigkeit von den
            jeweiligen aktuell gesetzten Werten der untergeordneten Objekte.

            1: Änderung der Zugriffsdefinition auf dem Objekt und rekursive Vererbung 
            auf alle untergeordneten Objekte
            unabhängig von den jeweiligen aktuell gesetzten Werten der untergeordneten Objekte.

            2: Änderung der Zugriffsdefinition nur auf dem Objekt

            Hinweis:\ 
            Beim übergeben des Werts 1 auf einer Sachakte vererbt sich
            die Zugriffsdefinition auf alle in der Akte enthaltenen Vorgänge und wieder auf alle Dokumente, 
            die in den Vorgängen enthalten sind.<br>
            Bei einer großen Anzahl von untergeordneten Objekten kann es zu Abbrüchen 
            aufgrund Objektsperren oder durch Timeouts kommen.
          format: int32
          example: 1
