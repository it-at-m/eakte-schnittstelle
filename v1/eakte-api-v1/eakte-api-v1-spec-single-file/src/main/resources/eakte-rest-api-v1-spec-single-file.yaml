    SearchObjNameAnfrageDTO:
      required:
        - objclass
        - searchstring
      type: object
      properties:
        searchstring:
          $ref: '#/components/schemas/searchstring'
        objclass:
          $ref: '#/components/schemas/objclass_in_search'
        reference:
          type: string
          description: Referenz des Fachdatum
          example: data_dognumber
        value:
          type: string
          description: Wert des Fachdatum
          example: '458965'
    SearchObjNameAntwortDTO:
      type: object
      properties:
        giobjecttype:
          type: array
          description: Auflistung aller Objekte, auf die der Suchstring zutrifft.
          example:
            - name: Beispielname
              id: COO.2150.9151.1.1206000
          items:
            $ref: '#/components/schemas/Objektreferenz'
    SetSignatureRequestDTO:
      required:
        - signaturetype
      type: object
      properties:
        signaturetype:
          type: string
          description: |
            COO-Adresse der Unterschriftenart<br>
            Anmerkung:<br>
            Titel ist nicht eindeutig, da es im System mehrere
            Unterschriftenarten mit dem gleichen Namen/Titel gibt.<br>
            In den jeweiligen Anwendungsfällen 
            (z.B. Vorgang stornieren, Eingang sperren, Eingang weglegen, Erledigung unterschreiben) 
            sind die Referenzen für Unterschriftsarten (signaturetype) definiert
          example: COO.1.1001.1.6485
        remark:
          type: string
          description: Bemerkung zur Unterschrift
          example: String
    StartWorkflowDTO:
      required:
        - workflowpattern
      type: object
      properties:
        workflowpattern:
          type: string
          description: |
            COO-Adresse der Muster für Verfügung (COOWF@1.1:PrescriptionTemplate)<br>
            Die COO-Adresse findet man über die GUI der eAkte, wenn man im Schreibtisch "Suche" ausführt, nach Muster für Verfügungen sucht. 
            In den Eigenschaften (im Tab Erstellung) der entsprechenden Mustervorlage steht die COO-Adresse. 
            Anmerkung: <br>
            Der Titel ist nicht eindeutig, da es im System mehrere
            „Muster für Verfügung“ mit dem gleichen Namen geben kann.
          example: COO.1.1001.1.6485
    UpdateSubjectAreaRequestDTO:
      required:
        - subjareascope
      type: object
      properties:
        subjareascope:
          type: string
          description: |
            Der neue Aktenplaneintragstyp.<br>
            Folgende Werte sind möglich:
            * Hauptgruppe
            * Obergruppe
            * Gruppe
            * Untergruppe
            * Betreffseinheit.

            Eine Änderung darf nur erfolgen wenn der Aktenplaneintragstyp leer ist.
          example: '"subjareascope": "Betreffseinheit"'
    ReadSubjectAreaFileAntwortDTO:
      type: object
      properties:
        giobjecttype:
          type: array
          description: |
            Liste aller Vorgänge der Akte
          example:
            - name: Beispielname
              id: COO.2150.9151.1.1206000
          items:
            $ref: '#/components/schemas/Objektreferenz'
    ReadSubjectAreaObjectsAntwortDTO:
      type: object
      properties:
        giobjecttype:
          type: array
          description: |
            Liste aller Vorgänge der Akte
          example:
            - name: Beispielname
              id: COO.2150.9151.1.1206000
          items:
            $ref: '#/components/schemas/Objektreferenz'
    CreateSubjectAreaUnitAnfrageDTO:
      required:
        - basenr
        - objaddress
      type: object
      properties:
        objaddress:
          type: string
          description: Objekt-ID (COO-Adresse) des übergeordneten Aktenplaneintrags
          example: COO.1.2302.1.8
        basenr:
          type: string
          description: Aktenplankennzeichen der Betreffseinheit
          example: 0001 B10 000
        subjareaspecreference:
          type: string
          description: Ableitung
          example: '1'
        shortterm:
          type: string
          description: Kurzbezeichnung
          example: Betreffseinheit B
        subjarchiveschedule:
          type: string
          description: |
            Standardmäßige Transferfrist für alle Objekte unterhalb der Betreffseinheit<br>
            Hinweis zur Transferfrist: siehe bei POST /files (Anlegen von Akten)
          example: 10 Jahre
        subjschedule:
          type: string
          description: Standardmäßige Aufbewahrungsfrist für alle Objekte unterhalb der Betreffseinheit
          example: 10 Jahre
        subjdispstate:
          type: string
          description: |
            Gewünschte Aussonderungsart für alle Objete unterhalb der Betreffseinheit
            * „DISPSTATE_ARCHIVE“ - für „A - Archivwürdig“
            * „DISPSTATE_DESTROY“ - für „V - Vernichten“
            * „DISPSTATE_DM_B“ für „B - Bewerten“

            Erläuterungen zu den Aussonderungsarten:
            * „A - Archivwürdig“ - Vorgänge oder Akten sind nach Ablauf der Aufbewahrungsfrist dem zuständigen Archiv als archivwürdig zu übermitteln.
            * „V - Vernichten“ - Vorgänge oder Akten werden nach Ablauf der Aufbewahrungsfrist vernichtet.
            * „B - Bewerten“ - Bewerten von Vorgängen oder Akten, deren Archivwürdigkeit nicht durch eine Vorentscheidung festgelegt ist.

            Die Aussonderungsart wird üblicherweise über die Aussonderungsart im Aktenplaneintrag gesetzt.
          example: A – Archivwürdig
        fileaccessdefinition:
          type: string
          description: Zugriffsdefinition für untergeordnete Akten
          example: allgemein bearbeitbar
    ArrayOfint:
      type: object
      description: Liste von Nummern
      properties:
        int:
          type: array
          items:
            type: integer
            format: int32
      example:
        int:
          - 1
          - 3
          - 5
    ReadUserFormsDataResponseDTO:
      type: object
      description: |
        Rückgabe der Verfahrenseigenschaft bestehend aus
        * dem Wert (oder Werteliste) der Verfahrenseigenschaft
        * der internen lfd. Nummer des Wertes der Verfahrenseigenschaft (bei einer Liste jeweils die lfdNr. aller Werte)
        * dem zugehörigen Referenznamen zur lfd. Nummer des Wertes der Verfahrenseigenschaft (bei einer Liste die Referenznamen aller Werte)
      properties:
        value:
          type: string
          description: Wert(e) der Verfahreneigenschaft als String
          example: |-
            Direktorium
            IT-Referat,
            Personal- und Organisationsreferat
        enuminteger:
          $ref: '#/components/schemas/ArrayOfint'
        enumreference:
          $ref: '#/components/schemas/ArrayOfstring'
    UpdateUserFormsDataRequestDTO:
      type: object
      properties:
        userformsdata:
          type: array
          items:
            $ref: '#/components/schemas/UserFormsReferenz'
  responses:
    '204':
      description: Objekt wurde erfolgreich aktualisiert.
    '400':
      description: Aufruf ans DMS ist gescheitert. Im Body sind Details enthalten.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DmsErrorResponse'
    '401':
      description: Falscher oder fehlender technischer Nutzer.
    '500':
      description: Ein unerwarteter Fehler innerhalb der EAI ist aufgetreten.
