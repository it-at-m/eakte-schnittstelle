        required: true
      responses:
        '204':
          $ref: '#/components/responses/204'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /cancelObjects/{objaddress}:
    put:
      tags:
        - /cancelObjects
      summary: Objekt stornieren (Vorgang, Dokument, Schriftstück)
      description: |
        Stornieren wird verwendet, wenn fälschlicherweise ein Schriftgutobjekt erstellt worden ist.<br>
        Nach dem Stornieren kann das stornierte Objekt über die Schnittstelle nicht mehr ausgelesen werden.<br>
        Das Aufheben von stornierten Objekten ist nur in der GUI der eGov-Suite möglich, nicht über die Schnittstelle.

        Der Status [FSCFOLIO@1.1001:objdocstate] des Objekts wird auf „Storniert“ gesetzt. 
        Zudem erfolgt gemäß dem Berechtigungskonzept ein Access Control List (ACL) Übergang.<br>
        Welcher ACL-Übergang beim Stornieren erfolgt, ist im Berechtigungskonzept definiert und 
        ist abhängig von der hinterlegten ACL des zu stornierenden Objekts.<br>
        Beispiel: Eine Akte hat die ACL für Schriftgutobjekte des Eigentümers. 
        Im Rahmen der Stornierung erfolgt der ACL-Übergang und 
        die Akte erhält die ACL für abgeschlossene Schriftgutobjekte des Eigentümers.

        Bei einer Stornierung werden auch alle untergeordneten Schriftgutobjekte storniert.
      operationId: CancelObject
      parameters:
        - $ref: '#/components/parameters/x_anwendung'
        - $ref: '#/components/parameters/userlogin'
        - $ref: '#/components/parameters/joboe'
        - $ref: '#/components/parameters/jobposition'
        - $ref: '#/components/parameters/objaddress'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /completeProcedureBusinessData:
    post:
      tags:
        - /completeProcedureBusinessData
      summary: Anlegen eines kompletten Vorgangs mit Dokument und Schriftstücken bzw. Ergänzung einzelner Schriftstücke beim Vorgang
      description: |
        Sobald eine Sachakte über die Fachdaten gefunden wurde, 
        (über die Parameter businessterm und businessvalue),
        wird folgendermaßen vorgegangen:

        * Eingangsparameter Vorgangstitel (shortnameprocedure):<br>
        Das System überprüft ob in der gefundenen Akte 
        bereits ein Vorgang mit dem Titel existiert.
          - Vorgang existiert bereits<br>
        Das Dokument wird in dem Vorgang abgelegt
          - Vorgang existiert noch nicht<br>
        Ein neuer Vorgang mit dem übergebenen Titel wird angelegt und das Dokument in dem Vorgang abgelegt.

        * Eingangsparameter Dokumenttitel (shortnamedocument):<br>
        Das System überprüft, ob in dem gefundenen Vorgang 
        bereits ein Eingangsdokument mit dem Titel existiert.
          - Eingangsdokument existiert bereits<br>
        Navigieren in das Eingangsdokument
          - Eingangsdokument existiert noch nicht<br>
        Ein neues Eingangsdokument mit dem übergebenen Titel wird angelegt & 
        * Das Schriftstück wird im entsprechenden Eingangsdokument abgelegt.
      operationId: CreateCompleteProcedureBusinessData
      parameters:
        - $ref: '#/components/parameters/x_anwendung'
        - $ref: '#/components/parameters/userlogin'
        - $ref: '#/components/parameters/joboe'
        - $ref: '#/components/parameters/jobposition'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCompleteProcedureBusinessDataRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCompleteProcedureBusinessDataResponseDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /contentObjectMetaData/{objaddress}:
