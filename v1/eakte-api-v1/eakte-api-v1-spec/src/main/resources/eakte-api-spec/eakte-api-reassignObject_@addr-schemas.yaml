components:
  schemas:

    ReAssignObjectDTO:
      required:
        - newtarget
      type: object
      properties:
        newtarget:
          type: string
          description: |
            COO-Adresse des neuen darüberliegenden Objektes 
            (Betreffseinheit bei einer Akte oder Akte bei einem Vorgang)
          example: COO.1.2302.1.76
        newoe:
          type: string
          description: COO-Adresse der Organisationseinheit
          example: COO.1.23.10.8854
