components:
  schemas:

    StartWorkflowDTO:
      required:
        - workflowpattern
      type: object
      properties:
        workflowpattern:
          type: string
          description: |
            COO-Adresse der Muster für Verfügung (COOWF@1.1:PrescriptionTemplate)\
            Die COO-Adresse findet man über die GUI der eAkte, wenn man im Schreibtisch "Suche" ausführt, nach Muster für Verfügungen sucht. 
            In den Eigenschaften (im Tab Erstellung) der entsprechenden Mustervorlage steht die COO-Adresse. 
            Anmerkung: \
            Der Titel ist nicht eindeutig, da es im System mehrere
            „Muster für Verfügung“ mit dem gleichen Namen geben kann.
          example: COO.1.1001.1.6485
