put:
  tags:
    - /revokeDepositObjects
  summary: z.A. aufheben für Akten oder Vorgänge
  description: |
    Die angegebene Akte oder Vorgang wird z.A. aufgehoben.\
    Wenn die z.A.-Setzung einer "Akte" aufgehoben wird, dann 
    * wird in der eAkte für die betreffende Akte der Wert im Feld "gültig bis" geleert
    * bleiben enthaltene Vorgänge z.A., können dann aber ggf. wieder in Bearbeitung genommen werden
    * bekommt die Akte Bearbeitungsstatus "erstellt" und den Status "in Bearbeitung"
    * können Inhalte  bearbeitet werden
    * werden das Enddatum für Transfer- und Aufbewahrung geleert
  operationId: RevokeDeposit
  parameters:
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/x_anwendung'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/userlogin'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/joboe'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/jobposition'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/objaddress'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'eakte-api--global-schemas.yaml#/components/schemas/DmsObjektResponse'
    '400':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/400'
    '401':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/401'
    '500':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/500'
