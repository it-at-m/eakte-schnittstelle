post:
  tags:
    - /incomings
  summary: Eingangsdokument anlegen
  description: |
    Neues Eingangsdokument erstellen unter dem angegebenen Vorgang (optional inklusive Schriftstücke).<br>
    Wenn das Eingangsdokument keinem Vorgang zugeordnet ist (referrednumber == NULL), 
    wird eine neue Aktivität „Eingang“ im Arbeitsvorrat erzeugt.
    
    Standardmäßig wird diese dem Benutzer mit dessen Standardrolle in dessen Arbeitsvorrat vorgeschrieben.<br>
    Sollte jedoch der Parameter useOE == true sein, 
    so soll die Aktivität „Eingang“ der OE (aus der Standardrolle des Benutzers) vorgeschrieben werden – 
    in diesem Fall, soll bei der Vorschreibung kein Benutzer eingetragen werden.
    
    Beim Anlegen von neuen Dokumenten wird die auf dem Vorgang gesetzte Zugriffsdefinition verwendet. 
    Anhand des Userlogins werden der Eigentümer (COOSYSTEM@1.1:objowner) und die Organisationseinheit (COOSYSTEM@1.1:objowngroud) gesetzt.
  operationId: CreateIncoming
  parameters:
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/x_anwendung'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/userlogin'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/joboe'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/jobposition'
  requestBody:
    content:
      multipart/form-data:
        schema:
          $ref: 'eakte-api-incomings-schemas.yaml#/components/schemas/CreateIncomingRequestBodyDTO'
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'eakte-api-incomings-schemas.yaml#/components/schemas/CreateIncomingAntwortDTO'
    '400':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/400'
    '401':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/401'
    '500':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/500'
