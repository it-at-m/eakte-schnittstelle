
post:
  tags:
    - /procedures
  summary: Anlegen eines kompletten Vorgangs inkl. Dokument und Schriftstücke
  description: |
    Es wird ein kompletter Vorgang mit einem Dokument und Schrifstück neu angelegt 
    bzw. es können auch einzelne Schriftstücke beim Vorgang ergänzt werden.<br>
    Sobald eine Sachakte lokalisiert wurde, wird folgendermaßen vorgegangen:
    
    Eingangsparameter Vorgangstitel shortnameprocedure:<br>
    Das System überprüft ob in der lokalisierten Akte bereits ein Vorgang mit dem Titel existiert.
    * Vorgang existiert bereits 
      - Navigieren in den Vorgang
    * Vorgang existiert noch nicht 
      - Ein neuer Vorgang mit dem übergebenen Titel wird angelegt und in den Vorgang navigiert.
    
    Eingangsparameter Dokumenttitel shortnamedocument<br>
    Das System überprüft, ob in dem lokalisierten Vorgang bereits 
    ein Eingangsdokument mit dem Titel existiert.
    * Eingangsdokument existiert bereits 
      - Navigieren in das Eingangsdokument
    * Eingangsdokument existiert noch nicht 
      - ein neues Eingangsdokument mit dem übergebenen Titel wird angelegt und in das Eingangsdokument navigiert.
  operationId: CreateCompleteProcedure
  parameters:
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/x_anwendung'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/userlogin'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/joboe'
    - $ref: 'eakte-api--parameters.yaml#/components/parameters/jobposition'
  requestBody:
    content:
      multipart/form-data:
        schema:
          $ref: 'eakte-api-procedures_complete-schemas.yaml#/components/schemas/CreateCompleteProcedureRequestDTO'
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'eakte-api-procedures_complete-schemas.yaml#/components/schemas/CreateCompleteProcedureResponseDTO'
    '400':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/400'
    '401':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/401'
    '500':
      $ref: 'eakte-api--default-responses.yaml#/components/responses/500'
