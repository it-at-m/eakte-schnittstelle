components:
  schemas:

    CreateObjectAndImportToInboxDTO:
      required:
        - objaddress
      type: object
      properties:
        objaddress:
          type: string
          description: Objekt-ID (COO-Adresse) des Postkorb
          example: COO.1.2302.1.8
        filesubj:
          type: array
          description: Betreffs der mitgesendeten Dokumente. Pro Dokument gibt es einen Eintrag in dieser Liste. Die Reihenfolge entspricht der Reihenfolge der Dokumente
          items:
            type: array
            description: Alle Betreffs eines einzelnen Dokuments
            items:
              type: string
              description: Ein einzelner Betreff-Text des Dokuments
          example:
            - [ "Betreff1 - Schriftstück1", "Betreff2 - Schriftstück1" ]
            - [ "Betreff1 - Schriftstück2" ]
      description: 'Parameter, die den Eingang von Schriftstücken in den Postkorb beschreiben'

    CreateObjectAndImportToInboxResponseDTO:
      type: object
      properties:
        listcontents:
          type: array
          items:
            $ref: 'eakte-api--global-schemas.yaml#/components/schemas/MetadataReferenz'

    CreateObjectAndImportToInboxRequestDTO:
      required:
        - params
      type: object
      properties:
        params:
          $ref: 'eakte-api-objectAndImportToInbox-schemas.yaml#/components/schemas/CreateObjectAndImportToInboxDTO'
        giattachmenttype:
          type: array
          description: Liste der Objektadressen und Namen der Schriftstücke im Dokument.
          items:
            type: string
            format: binary

