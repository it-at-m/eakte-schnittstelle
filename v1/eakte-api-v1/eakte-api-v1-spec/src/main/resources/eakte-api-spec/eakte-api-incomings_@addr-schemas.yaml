components:
  schemas:

    ReadIncomingAntwortDTO:
      type: object
      properties:
        shortname:
          type: string
          description: Titel
          example: 2016 Anträge Firma XY
        filesubj:
          type: string
          description: |2
                      Betreff (mehrzeilig)
                      Mehrzeilige Felder werden mit Zeilenumbrüchen oder HTML Kodierung &#10; in Abfragen unterstützt.
          example: Alle Anträge der Firma XY aus dem Jahr 2016
        objterms:
          type: string
          description: >-
            Schlagworte, Angabe der Schlagworte getrennt mit „;“. Kein Semikola
            am Ende angeben.
          example: Firma XY; Anträge; Anträge 2016
        accdef:
          type: string
          description: >-
            Zugriffsdefinition

            Eindeutiger Name der Zugriffsdefinition. z.B.:

            • Zugriffsdefinition für Schriftgutobjekte (allgemein lesbar)

            • Zugriffsdefinition für Schriftgutobjekte der Organisationseinheit

            • Zugriffsdefinition für Schriftgutobjekte der Organisationseinheit
            und Zentralregistratur

            • Zugriffsdefinition für Schriftgutobjekte des Eigentümers

            Hinweis: Hierbei kann die gewünschte Zugriffsdefinition der Akte
            gesetzt werden. Wenn kein Wert übergeben wird, wird die auf dem
            Aktenplaneintrag hinterlegte Zugriffsdefinition initialisiert.
          example: Zugriffsdefinition für Schriftgutobjekte (allgemein lesbar)
        objname:
          type: string
          description: Eingangskennzeichen
          example: Eingangspost vom 21.10.2016 (0010 A20 011-4-0006-0001)
        referrednumber:
          type: string
          description: Objekt-ID (COO-Adresse) der zugehörigen Vorgangs
          example: COO.1.2301.1.1042432
        foreignnr:
          type: string
          description: Fremdes Geschäftszeichen
          example: A2016-10-2016-Landeshauptstadt-München
        delivery:
          type: string
          description: Termin (Datum/Uhrzeit)
          format: date-time
          example: '2016-10-26T18:16:29+01:00'
        documentremarks:
          type: string
          description: Dokumentbezogene Hinweise
          example: Antrag auf Baugenehmigung
        incattachments:
          type: string
          description: Sonstige Anlagen
          example: Ausfüllhilfe Antrag auf Baugenehmigung
        gimetadatatype:
          type: array
          description: Schriftstücke
          example:
            objaddress: COO.1.2301.1.1041875
            filename: Antrag auf Baugenehmigung
            fileextension: pdf
            objclass: PDF-Dokument
            contsize: '243'
            objcreatedby:
              string:
                - musterfraum
            objcreatedat: '2018-07-23T08:59:52+01:00'
            objchangedby:
              string:
                - mustermannm
            objmodifiedat: '2018-07-23T09:23:52+01:00'
          items:
            $ref: 'eakte-api--global-schemas.yaml#/components/schemas/MetadataReferenz'

    UpdateIncomingAntwortDTO:
      type: object
      properties:
        objid:
          type: string
          description: Objekt-ID (COO-Adresse) des Objekts
          example: COO.1.2301.1.1042441
        objname:
          type: string
          description: |
            Objektname des erzeugten/gefundenen Vorgangs<br>
            Der Name wird in der eAkte gebildet 
            aus dem "Titel des Vorgangs" ("Aktenplankennzeichen"-"lfdNr der Akte"/"lfdNr des Vorgangs"-"lfdNr des Dokuments")
          example: Eingangspost vom 28.05.2026 (0010-11/2-0006)
        giobjecttype:
          type: array
          description: |
            Liste der Objektadressen und Namen
            der Schriftstücke im Dokument.
          items:
            $ref: 'eakte-api--global-schemas.yaml#/components/schemas/Objektreferenz'

    CreateIncomingBasisAnfrageDTO:
      description: |
        Json Objekt, das die Parameter für den Eingang spezifiziert.<br>
        Das Objekt ist vom Typ `CreateIncomingBasisAnfrageDTO`.
      type: object
      properties:
        shortname:
          type: string
          description: Titel
          example: 2016 Anträge Firma XY
        filesubj:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/Betreff'
        objterms:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/Schlagworte'
        accdef:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/Zugriffsdefinition'
        referrednumber:
          type: string
          description: Objekt-ID (COO-Adresse) des Vorgangs
          example: COO.1.2301.1.1042432
        useou:
          type: boolean
          description: |
            Der Wert wird nur ausgelesen wenn (referrednumber == NULL) d.h.
            keine Vorgangszuordnung stattfindet.
            * Wenn true, wird die Aktivität „Neue Erledigung“ an die OE (ohne
            Benutzer vorgeschrieben).
            * Wenn kein Wert (oder false) übermittelt wird, wird die direkte
            Vorschreibung an den Benutzer durchgeführt.
          example: false
        delivery:
          type: string
          description: Eingangsdatum des Objekts
          format: date-time
        foreignnr:
          type: string
          description: |
            Fremdes Geschäftszeichen<br>
            In diesem Feld kann - falls erforderlich - das Geschäftszeichen einer anderen Organisation eingetragen werden.
          example: A2016-10-2016-Landeshauptstadt-München
        documentremarks:
          type: string
          description: Dokumentbezogene Hinweise
          example: Antrag auf Baugenehmigung
        incattachments:
          type: string
          description: Sonstige Anlagen
          example: Bebauungsplan
        definition:
          type: string
          description: Objekt-ID (COO-Adresse) der Definition für Verfahren
        userformsdata:
          type: array
          items:
            $ref: 'eakte-api--global-schemas.yaml#/components/schemas/UserFormsReferenz'

    UpdateIncomingAnfrageDTO:
      type: object
      properties:
        shortname:
          type: string
          description: Titel
          example: 2016 Anträge Firma XY
        filesubj:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/Betreff'
        objterms:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/Schlagworte'
        accdef:
          $ref: 'eakte-api--global-schemas.yaml#/components/schemas/Zugriffsdefinition'
        foreignnr:
          type: string
          description: |
            Fremdes Geschäftszeichen<br>
            In diesem Feld kann - falls erforderlich - das Geschäftszeichen einer anderen Organisation eingetragen werden.
          example: A2016-10-2016-Landeshauptstadt-München
        delivery:
          type: string
          description: |
            Eingangsdatum des Objekts<br>
            In diesem Feld wird vermerkt, wann das Dokument eingegangen ist.
          format: date-time
        documentremarks:
          type: string
          description: Dokumentbezogene Hinweise
          example: Antrag auf Baugenehmigung
        incattachments:
          type: string
          description: Sonstige Anlagen
          example: Bebauungsplan
      description: 'Parameter, die den Eingang spezifizieren'

    UpdateIncomingRequestBodyDTO:
      required:
        - params
      type: object
      properties:
        params:
          $ref: 'eakte-api-incomings_@addr-schemas.yaml#/components/schemas/UpdateIncomingAnfrageDTO'
        giattachmenttype:
          type: array
          description: |
            Liste der Schriftstücke<br>
            Schriftstücke können über diesen Aufruf nicht geändert bzw. ersetzt werden.
            Neue Schriftstücke können bei Bedarf (zum Beispiel zum nachträglichen Hinzufügen von Anhängen
            vor dem Postversand) über diesen Aufruf hinzugefügt werden.
          items:
            type: string
            format: binary
