id: configure local audience
author: Default
realm: local_realm
changes:
  # add local audience mapper
  - addClientMapper:
      clientId: local
      name: local_audience
      protocolMapper: oidc-audience-mapper
      config:
        access.token.claim: "true"
        id.token.claim: "true"
        included.client.audience: "local"
        included.custom.audience: ""

  # add public_local audience mapper
  - addClientMapper:
      clientId: public_local
      name: public_local_audience
      protocolMapper: oidc-audience-mapper
      config:
        access.token.claim: "true"
        id.token.claim: "true"
        included.client.audience: "public_local"
        included.custom.audience: ""
