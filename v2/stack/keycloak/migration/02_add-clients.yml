id: add client
author: Default
realm: local_realm
changes:
  # create local client
  - addSimpleClient:
      clientId: local
      secret: client_secret
      publicClient: false
      serviceAccountsEnabled: true
      redirectUris:
        - http://*
        - https://*
  - updateClient:
      clientId: local
      fullScopeAllowed: false

  # create public_local client
  - addSimpleClient:
      clientId: public_local
      publicClient: true
      redirectUris:
        - http://*
        - https://*
  - updateClient:
      clientId: public_local
      fullScopeAllowed: false
      webOrigins:
        - "*"
