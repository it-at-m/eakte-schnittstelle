openapi: 3.0.1

info:
  title: eAkte REST-API Spezifikation
  description: Spezifikation für die REST-Schnittstelle der eAkte
  version: '2.0.0'

  contact:
    name: Competence Center eAkte
    url: https://it-at-m.github.io/eakte-schnittstelle
    email: schnittstelle.eakte@muenchen.de

  license:
    name: MIT
    url: https://github.com/it-at-m/eakte-schnittstelle/blob/main/LICENSE

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: jwt

security:
  - bearerAuth: []

tags:
  - name: Vorgang
    description: Procedure
  - name: Dokument
    description: Parent-Klasse von Eingangsdokument (Incoming) / Erledigung (Outgoing) / Internes Dokument (Internal)
  - name: Eingangsdokument
    description: Incoming (Sub-Klasse von Dokument)
  - name: Erledigung
    description: Outgoing (ehem. Ausgang) (Sub-Klasse von Dokument)
  - name: Internes Dokument
    description: Internal (Sub-Klasse von Dokument)

paths:
  # Vorgang
  '/api/v2/akten/{akteId}/dokumente':
    $ref: 'AkteVorgaenge.yaml'
  '/api/v2/vorgaenge':
    $ref: 'Vorgaenge.yaml'
  '/api/v2/vorgaenge/{vorgangsId}':
    $ref: 'Vorgang.yaml'
  # Dokument
  '/api/v2/vorgaenge/{vorgangsId}/dokumente':
    $ref: 'VorgangsDokumente.yaml'
  # Eingangsdokument
  '/api/v2/eingangsdokumente':
    $ref: 'Eingangsdokumente.yaml'
  '/api/v2/eingangsdokumente/{eingangsdokumentId}':
    $ref: 'Eingangsdokument.yaml'
  # Erledigung
  '/api/v2/erledigungen':
    $ref: 'Erledigungen.yaml'
  '/api/v2/erledigungen/{erledigungsId}':
    $ref: 'Erledigung.yaml'
  # Internes Dokument
  '/api/v2/interne-dokumente':
    $ref: 'InterneDokumente.yaml'
  '/api/v2/interne-dokumente/{dokumentId}':
    $ref: 'InternesDokument.yaml'
