components:
  schemas:
    Eingang:
      type: object
      anyOf:
        - $ref: 'Dokument_Datentypen.yaml#/components/schemas/Dokument'
      properties:
        fremdesGeschaeftszeichen:
          type: string
        eingangsDatum:
          type: string
        hinweis:
          type: string

    EingangListeResponse:
      type: object
      properties:
        anzahl:
          $ref: '_SucheDatentypen.yaml#/components/schemas/AnzahlListenElemente'
        elemente:
          type: array
          description: Liste von Eingängen
          items:
            $ref: '#/components/schemas/Eingang'
