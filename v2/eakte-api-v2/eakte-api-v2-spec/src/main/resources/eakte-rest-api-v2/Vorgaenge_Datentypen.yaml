components:
  schemas:
    BaseVorgang:
      type: object
      required:
        - titel
        - originalMedium
        - status
        - bearbeitungsstatus
        - zugriffsdefinition
        - organisationseinheit
        - weitereEigenschaften
      properties:
        titel:
          type: string
        betreff:
          type: string
        hinweis:
          type: string
        originalMedium:
          type: string
          enum:
            - "elektronisch"
            - "hybrid"
            - "papier"
        zugriffsdefinition:
          type: string
          example: "Eigene Organisationseinheit"

    Vorgang:
      type: object
      required:
        - id
        - name
        - status
        - bearbeitungsstatus
        - organisationseinheit
        - eigenschaftenMap
        - eigenschaftenListe
      allOf:
        - $ref: "./Vorgaenge_Datentypen.yaml#/components/schemas/BaseVorgang"
      properties:
        id:
          type: string
        akteId:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - In Bearbeitung
            - Suspendiert
            - Abgeschlossen
            - Storniert
            - Archiviert
        bearbeitungsstatus:
          type: string
        organisationseinheit:
          type: string
        weitereEigenschaften:
          type: array
          items:
            $ref: '_SucheDatentypen.yaml#/components/schemas/EigenschaftEintrag'

    CreateVorgang:
      type: object
      allOf:
        - $ref: "./Vorgaenge_Datentypen.yaml#/components/schemas/BaseVorgang"
      # TODO required
      properties:
        dfvId:
          type: string
        # TODO DfV attributes

    CreateVorgangResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string

    VorgangListeResponse:
      type: object
      properties:
        anzahl:
          $ref: '_SucheDatentypen.yaml#/components/schemas/AnzahlListenElemente'
        elemente:
          type: array
          description: Liste von Vorgängen
          items:
            $ref: 'Vorgaenge_Datentypen.yaml#/components/schemas/Vorgang'
