components:
  schemas:
    BaseVorgang:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        betreff:
          type: string
        geschaeftsgangvermerk:
          type: string
          description: Geschäftsgangvermerk für Prozessverantwortlichen
          example: Warte auf Rückmeldung
        originalMedium:
          type: string
          enum:
            - "elektronisch"
            - "hybrid"
            - "papier"
        zugriffsdefinition:
          type: string

    Vorgang:
      type: object
      required:
        - id
        - langname
        - status
        - bearbeitungsstatus
        - organisationseinheit
        - eigenschaftenMap
        - eigenschaftenListe
      allOf:
        - $ref: "./Vorgaenge_Datentypen.yaml#/components/schemas/BaseVorgang"
      properties:
        id:
          type: string
        sachakteId:
          type: string
        langname:
          type: string
        status:
          type: string
          enum:
            - In Bearbeitung
            - Suspendiert
            - Abgeschlossen
            - Storniert
            - Archiviert
        bearbeitungsstatus:
          type: string
        organisationseinheit:
          type: string
        eigenschaftenMap:
          type: object
          additionalProperties: true
        eigenschaftenListe:
          type: array
          items:
            $ref: '_SucheDatentypen.yaml#/components/schemas/EigenschaftEintrag'

    CreateVorgang:
      type: object
      allOf:
        - $ref: "./Vorgaenge_Datentypen.yaml#/components/schemas/BaseVorgang"
      # TODO required
      properties:
        vorlagenId:
          type: string
        # TODO
        laufweg:
          type: string
          default: null
        # TODO DfV attributes

    CreateVorgangResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string

    VorgangListeResponse:
      type: object
      properties:
        anzahl:
          $ref: '_SucheDatentypen.yaml#/components/schemas/AnzahlListenElemente'
        elemente:
          type: array
          description: Liste von Vorgängen
          items:
            $ref: 'Vorgaenge_Datentypen.yaml#/components/schemas/Vorgang'
