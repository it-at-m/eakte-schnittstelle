components:
  schemas:

    ErrorResponse:
      type: object
      description: >
        Container für RFC9457 Fehlermeldung und konkrete Fabasoft Fehlermeldung falls Ursache
      required:
        - status
        - title
      properties:
        status:
          type: integer
          format: int32
        title:
          type: string
        instance:
          type: string
        detail:
          type: string
        dmsErrorReference:
          type: string

    Stelle:
      type: string
      enum:
        - Sachbearbeitung
        - Sekretariat
        - Leitung
        - Registratur
        - Schriftgutverwaltung
        - Vorlagenverwaltung
        - Vorlagenadministration
        - Fachadministration
        - OE-Administration
        - Mitarbeit
