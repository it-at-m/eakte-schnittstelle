components:
  schemas:
    Akte:
      type: object
      description: |
        Repräsentation einer Akte.\
        Aufgrund der Konfigurierbarkeit der Attribute (verfahrensabhängige Metadaten, siehe
        Fabasoft eGov-Suite "Definition von Verfahren") werden diese in einer dynamisch 
        aufgebauten Liste geführt und nichts als Felder in einer fixen (JSON-) Datenstruktur.
        \
        Um die innerhalb einer bestimmten Betreffseinheit verfügbaren Custom-Attribute auf
        Vorgangsebene sowie die Standard-Attribute der Akte zu erfahren, kann über den Endpunkt
        '/v2/Attribute' eine Abfrage (GET-Methode) getätigt werden (s. Spezifikation dieses
        Endpunktes, in diesem Fall die Verwendung des Filters 'Schriftgutebene=Akte').
      required:
        - id
        - betreffseinheitId
        - titel
        - name
        - betreff
        - zugriffsdefinition
        - zugriffsdefinitionVorgang
        - dfvId
        - weitereEigenschaften
      properties:
        id:
          type: string
        betreffseinheitId:
          type: string
        titel:
          type: string
        name:
          type: string
        betreff:
          type: string
        zugriffsdefinition:
          type: string
        zugriffsdefinitionVorgang:
          type: string
        dfvId:
          type: string
        weitereEigenschaften:
          type: array
          items:
            $ref: '_SucheDatentypen.yaml#/components/schemas/EigenschaftEintrag'

    AkteListeResponse:
      type: object
      properties:
        anzahl:
          $ref: '_SucheDatentypen.yaml#/components/schemas/AnzahlListenElemente'
        elemente:
          type: array
          description: Liste von Akten
          items:
            $ref: 'Akten_Datentypen.yaml#/components/schemas/Akte'
