components:
  schemas:
    DokumentBase:
      type: object
      required:
        - name
      properties:
        vorgangId:
          type: string
        name:
          type: string
        betreff:
          type: string
        hinweis:
          type: string
        zugriffsdefinition:
          type: string
        organisationseinheit:
          type: string

    Dokument:
      type: object
      allOf:
        - $ref: '#/components/schemas/DokumentBase'
      required:
        - klasse
        - id
        - langname
      properties:
        klasse:
          type: string
          enum:
            - Eingang
            - Erledigung
            - Intern
        id:
          type: string
        langname:
          type: string
        weitereEigenschaften:
          type: array
          items:
            $ref: '_SucheDatentypen.yaml#/components/schemas/EigenschaftEintrag'

    DokumentListeResponse:
      type: object
      properties:
        anzahl:
          $ref: '_SucheDatentypen.yaml#/components/schemas/AnzahlListenElemente'
        elemente:
          type: array
          description: Liste von Dokumenten
          items:
            $ref: '#/components/schemas/Dokument'
