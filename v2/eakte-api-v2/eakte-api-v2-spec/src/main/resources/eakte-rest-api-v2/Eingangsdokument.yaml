get:
  tags:
    - Eingangsdokument
  summary: Eingangsdokument lesen
  operationId: GetEingangsdokument
  parameters:
    - in: path
      name: eingangsdokumentId
      schema:
        type: string
      required: true
    - $ref: '_HttpStandardParameter.yaml#/components/parameters/LoginName'
    - $ref: '_HttpStandardParameter.yaml#/components/parameters/Rolle'
    - $ref: '_HttpStandardParameter.yaml#/components/parameters/Organisationseinheit'
    - $ref: '_SucheDatentypen.yaml#/components/parameters/Eigenschaften'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'Eingangsdokument_Datentypen.yaml#/components/schemas/Eingangsdokument'
    '404':
      description: Eingangsdokument konnte nicht gefunden werden.
    '400':
      description: Aufruf ans DMS ist gescheitert. Im Body sind Details enthalten.
      content:
        application/json:
          schema:
            $ref: '_GlobaleDatentypen.yaml#/components/schemas/ErrorResponse'
    '401':
      description: Falsche oder fehlende Anmeldeinformationen.
      content:
        application/json:
          schema:
            $ref: '_GlobaleDatentypen.yaml#/components/schemas/ErrorResponse'
    '500':
      description: Ein unerwarteter Fehler innerhalb der EAI ist aufgetreten.
      content:
        application/json:
          schema:
            $ref: '_GlobaleDatentypen.yaml#/components/schemas/ErrorResponse'
