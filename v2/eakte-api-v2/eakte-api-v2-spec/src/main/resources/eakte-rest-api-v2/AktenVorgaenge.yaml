post:
  tags:
    - Akte
  summary: Vorgang unter Akte erstellen
  operationId: CreateVorgang
  parameters:
    - in: path
      name: aktenId
      schema:
        type: string
      required: true
    - $ref: '_HttpStandardParameter.yaml#/components/parameters/LoginName'
    - $ref: '_HttpStandardParameter.yaml#/components/parameters/Rolle'
    - $ref: '_HttpStandardParameter.yaml#/components/parameters/Organisationseinheit'
  requestBody:
    content:
      application/json:
        schema:
          $ref: 'Vorgaenge_Datentypen.yaml#/components/schemas/CreateVorgang'
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'Vorgaenge_Datentypen.yaml#/components/schemas/CreateVorgangResponse'
    '400':
      description: Aufruf ans DMS ist gescheitert. Im Body sind Details enthalten.
      content:
        application/json:
          schema:
            $ref: '_GlobaleDatentypen.yaml#/components/schemas/ErrorResponse'
    '401':
      description: Falsche oder fehlende Anmeldeinformationen.
      content:
        application/json:
          schema:
            $ref: '_GlobaleDatentypen.yaml#/components/schemas/ErrorResponse'
    '500':
      description: Ein unerwarteter Fehler innerhalb der EAI ist aufgetreten.
      content:
        application/json:
          schema:
            $ref: '_GlobaleDatentypen.yaml#/components/schemas/ErrorResponse'
