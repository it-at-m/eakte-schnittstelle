
components:
  parameters:

    FachverfahrensID:
      name: FachverfahrensID
      in: header
      description: |
        **Aufrufende Fachanwendung**
        
        Die FachverfahrensID identifziert ein Fachverfahren behördenunabhängig und wird vom Betrieb eAkte vergeben
        
        Der mitgegebene Wert wird auch als Http-Header in der Antwort zurückgegeben. 
        Somit ist ein Filtern der Antworten nach Fachverfahren möglich.
      required: false
      schema:
        type: string
      example: SWH

    LoginName:
      name: LoginName
      in: header
      description: |
        **Benutzer-Login** (Benutzer-Kontext für den SOAP-Aufruf)\
        Log-in-Name des Benutzerobjekts
      required: false
      schema:
        type: string
      example: max.mustermann

    Organisationseinheit:
      name: Organisationseinheit
      in: header
      description: |
        URI der zu verwendenden **Organisationseinheit** des angemeldeten Nutzers.\
        \
        Die OE ist dann wichtig anzugeben, 
        wenn der Nutzer in mehreren OEs zugeordnet ist.\
        Über diese OE wird der Mandant zugeordnet und 
        entsprechend die Berechtigungen geprüft.
      required: false
      schema:
        type: string
      example: COO.1.2300.1.847

    Stelle:
      name: Stelle
      in: header
      description: |
        Referenz der Stelle (**Stelle des Nutzers** in der eAkte).
        * Sachbearbeitung - OfficialInCharge
        * Registratur - Official
        * Sekretariat - Secretary
        * Leitung - Head
        * Fachadministration - OpAdm
        * Schriftgutverwaltung - DocumentManager
        
        Es dürfen ausschließlich die Stellen genannt werden, 
        die bei der LHM genutzt werden.\
        Die Rolle Fachadministrator ist bei Schnittstellen nicht erlaubt!
      required: false
      schema:
        type: string
      example: DocumentManager

    Bedingungen:
      name: Bedingungen
      in: query
      description: |
        Bedingungen (Suchkriterien, Restriktionen) für die Suche nach Schriftgutobjekten 
        (Betreffseinheiten, Akten, Vorgänge und Dokumente)

        Der Wert dieses URL-Parameters mus "URL-Encoded" sein (siehe z.B. https://en.wikipedia.org/wiki/Percent-encoding)
        
        Die Bedingungen werden als Query-Parameter "Bedingungen" als Teil der URL 
        übertragen (Beispiel: "/v1/Akten?Bedingungen=Aktenzeichen%3D%22AZ1.2.3.4%22", wobei die URL-enkodierte 
        Bedingung im Klartext hier lautet: "Aktenzeichen="AZ1.2.3.4").
        Dadurch können diese Suchen als einfache Strings konfiguriert bzw. im Browser als Bookmark gespeichert
        werden.

        Die 'Bedingungen' sind hierbei eine Liste von komma-separierten Einzelbedingungen.
        Eine Einzelbedingung hat die Struktur 'Attributname Operator Wert'.

        Operatoren sind
        * "=" / "eq"
        * ">" / "gt"
        * "<" / "lt"
        * ">=" / "ge"
        * "<=" / "le"
        * "!=" / "<>" / "ne"
        * "~" / "like"

        Falls die Sonderzeichen als Operatoren verwendet werden, können Attributname, Operator und Wert zusammengeschreiben werden,
        wenn die textliche Alternative verwendet wird, müssen die Teile der Einzelbedingung durch Leerzeichen separiert werden.

        Attributnamen dürfen *nicht* durch Anführungszeichen umfasst werden.

        Attributwerte können optional durch Anführungszeichen (paarweise einfache oder doppelte) umfasst werden.

        Mehrfach genannte identische Attributnamen werden als alternative Werte betrachtet (ODER-Verknüpfung).

        Verschiedenen Attributnamen werden als weitergehende Einschränkung betrachtet (UND-Verknüpfung).

      required: false
      schema:
        type: string
      example: |
        "ErzeugtAmUm%20ge%2002.03.2025%2C%20ErzeugtAmUm%20le%2010.03.2025%2C%20ErzeugtVon%20%3D%20%22COO.1.2.3.4%22"\
        was die URL-enkodierte Form folgender Bedingungen ist:\
        ErzeugtAmUm ge 02.03.2025, ErzeugtAmUm le 10.03.2025, ErzeugtVon = "COO.1.2.3.4"
