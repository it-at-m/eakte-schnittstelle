openapi: 3.0.1

info:
  title: eAkte REST-API Spezifikation
  description: Spezifikation für die REST-Schnittstelle der eAkte
  version: '2.0.0'

  contact:
    name: Competence Center eAkte
    url: https://it-at-m.github.io/eakte-api
    email: schnittstelle.eakte@muenchen.de

  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /

components:
  securitySchemes:
    basicAuth:
      $ref: '_SicherheitsSchemata.yaml#/components/securitySchemes/basicAuth'
    bearerAuth:
      $ref: '_SicherheitsSchemata.yaml#/components/securitySchemes/bearerAuth'

security:
  - basicAuth: []

paths:

  # lower-case-kebab?
  '/v2/Aktenplaneintraege':
    $ref: 'Aktenplaneintraege_Liste.yaml'

  '/v2/Aktenplaneintraege/{aktenplaneintragsId}':
    $ref: 'Aktenplaneintraege_Einzelsatz.yaml'

  # lower-case-kebab?
  '/v2/Akten':
    $ref: 'Akten_Liste.yaml'

  '/v2/Akten/{aktenId}':
    $ref: 'Akten_Einzelsatz.yaml'

  '/v2/Attributbeschreibungen':
    $ref: 'Attributbeschreibungen_Liste.yaml'

  '/v2/Attributbeschreibungen/{attributbeschreibungsId}':
    $ref: 'Attributbeschreibungen_Einzelsatz.yaml'

  '/v2/Organisationseinheiten':
    $ref: 'Organisationseinheiten_Liste.yaml'

  '/v2/Organisationseinheiten/{organisationseinheitenId}':
    $ref: 'Organisationseinheiten_Einzelsatz.yaml'
